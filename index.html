<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>xfstests dash</title>
  <meta name="description" content="xfstests xunit results parser and visualizer">
  <meta name="keywords" content="junit, xfstests, xunit">
  <meta name="author" content="André Tarnowsky">
  <style>
    body {
      max-width: 55em;
    }
    textarea, input[type="text"] {
      font-size: 12px;
      width: 100%;
    }
    fieldset, h1 {
      margin: 10px;
    }
    .testsuite-name, .testcase-name {
      max-width: 400px;
      overflow: hidden;
      display: inline-block;
      white-space: nowrap;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
    .testcase-name {
      max-width:  600px;
    }
    .plot-rect {
      opacity: 0.8;
    }
    .plot-rect:hover {
      opacity: 1;
      fill: #FFFFFF;
      cursor: pointer;
    }
    .error-border {
      border: 2px solid red;
    }
    .import {
      display: grid;
      grid-auto-flow: column;
      grid-column-gap: 8px;
    }
    #plotVector {
      overflow: scroll;
      width: 100%;
      margin: 10px;
    }
    .xml {
      margin: 10px;
    }
  </style>
</head>
<body>

  <h1>xfstests dash</h1>

  <div id="plotVector"></div>
  <fieldset id="settings">
    <legend>Plot settings:</legend>
    <input id="settingPlotPassed" class="setting" type="checkbox" checked>
    <label for="settingPlotPassed">Plot passed tests.</label>
    <input id="settingPlotSkipped" class="setting" type="checkbox" checked>
    <label for="settingPlotSkipped">Plot skipped tests.</label>
    <input id="settingPlotFailed" class="setting" type="checkbox" checked>
    <label for="settingPlotFailed">Plot failed tests.</label>
    <input id="settingErrorIsFailure" class="setting" type="checkbox" checked>
    <label for="settingErrorIsFailure">Treat errors as if they were failures.</label>
  </fieldset>

  <textarea class="xml"
    placeholder="xunit XML - paste here, or use import fields below..."
    rows="15"></textarea>

  <fieldset>
    <legend>Import xunit data from local file:</legend>
      <input type="file" id="file" name="file" accept=".gz,.xml,application/xml"
        title="Load xfstests xunit result.xml file" />
  </fieldset>
  <fieldset class="import">
    <legend>Import from URL:</legend>
    <input type="text" class="url"
      placeholder="https://ddiss.github.io/xfstests-dash/test/btrfs-fstests.xml" />
    <input type="button" value="Import"
      onclick="loadURL(document.querySelector('input.url'))" />
  </fieldset>

  <div id="result"></div>
  <script src="xfstests_dash.js"></script>
</body>
</html>
